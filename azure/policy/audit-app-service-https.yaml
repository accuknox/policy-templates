properties:
  displayName: Audit HTTPS-only access for App Service applications
  policyType: Custom
  mode: Indexed
  description: >-
    Audits App Service applications, including function applications, when
    HTTPS-only access is not enabled. This policy doesn't block changes.
  metadata:
    version: 1.0.0
    category: App Service
    deploymentTier: Universal audit
  policyRule:
    if:
      allOf:
        - field: type
          equals: Microsoft.Web/sites
        - field: Microsoft.Web/sites/httpsOnly
          notEquals: true
    then:
      effect: audit
