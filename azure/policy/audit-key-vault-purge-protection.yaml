properties:
  displayName: Audit purge protection for Azure Key Vault
  policyType: Custom
  mode: Indexed
  description: >-
    Audits Key Vault resources that don't enable purge protection. This policy
    reports findings without changing vault retention or deletion behavior.
  metadata:
    version: 1.0.0
    category: Key Vault
    deploymentTier: Universal audit
  policyRule:
    if:
      allOf:
        - field: type
          equals: Microsoft.KeyVault/vaults
        - field: Microsoft.KeyVault/vaults/enablePurgeProtection
          notEquals: true
    then:
      effect: audit
